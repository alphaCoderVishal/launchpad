openapi: 3.0.3
info:
  title: Launchpad deployment control plane
  version: 1.0.0
  description: Local single-worker control plane. Release allowlist and owner-scoped APIs. Production is an approval policy on the same local service slot.
servers:
  - url: http://127.0.0.1:8088
security:
  - bearerAuth: []
paths:
  /api/me:
    get:
      summary: Resolve token identity and operator role
      responses:
        '200': {description: Identity}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/services:
    get:
      summary: List owned services; operators see all
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Service'}}
    post:
      summary: Register a service owned by the authenticated principal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: '^[a-z][a-z0-9-]{2,39}$'}
      responses:
        '201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/Service'}}}}
        '400': {description: Invalid name or unknown property}
        '409': {description: Name already exists}
        '422': {description: Owner quota of five services exceeded}
  /api/services/{name}:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    get:
      summary: Fetch a service and its active route
      responses:
        '200': {description: Service, content: {application/json: {schema: {$ref: '#/components/schemas/Service'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/services/{name}/deployments:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    get:
      summary: Deployment history, newest first
      responses:
        '200': {description: History, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Deployment'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Enqueue an idempotent deployment intent
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,80}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [release, environment]
              properties:
                release: {type: string, enum: [v1, v2, bad-health]}
                environment: {type: string, enum: [dev, prod]}
      responses:
        '202': {description: Accepted or replayed original intent, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
        '400': {description: Invalid payload or key}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Key payload conflict or service has an in-flight intent}
  /api/deployments/{id}:
    parameters:
      - {$ref: '#/components/parameters/DeploymentId'}
    get:
      summary: Inspect durable deployment status
      responses:
        '200': {description: Deployment, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/deployments/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/DeploymentId'}
    post:
      summary: Operator approval of a pending production intent
      responses:
        '200': {description: Queued deployment, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
        '403': {description: Operator role required}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Wrong state}
  /api/deployments/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/DeploymentId'}
    post:
      summary: Owner or operator cancellation before worker execution
      responses:
        '200': {description: Cancelled deployment, content: {application/json: {schema: {$ref: '#/components/schemas/Deployment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Deployment already executing or terminal}
  /api/deployments/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/DeploymentId'}
    get:
      summary: Attributable audit timeline, oldest first
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer, format: int64}
                    deploymentId: {type: string, format: uuid}
                    actor: {type: string}
                    type: {type: string}
                    detail: {type: string}
                    createdAt: {type: string, format: date-time}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/services/{name}/response:
    parameters:
      - {$ref: '#/components/parameters/ServiceName'}
    get:
      summary: Call the currently promoted real workload through the control plane
      responses:
        '200': {description: Workload JSON greeting}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {description: Previously active workload now unavailable}
        '503': {description: No healthy release promoted}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ServiceName: {name: name, in: path, required: true, schema: {type: string}}
    DeploymentId: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Unauthorized: {description: Missing or invalid bearer token}
    NotFound: {description: Missing resource or resource outside caller ownership}
  schemas:
    Service:
      type: object
      properties:
        name: {type: string}
        owner: {type: string}
        activeRelease: {type: string, nullable: true}
        activeContainer: {type: string, nullable: true}
        activePort: {type: integer, nullable: true}
        createdAt: {type: string, format: date-time}
    Deployment:
      type: object
      properties:
        id: {type: string, format: uuid}
        serviceName: {type: string}
        release: {type: string, enum: [v1, v2, bad-health]}
        environment: {type: string, enum: [dev, prod]}
        requestedBy: {type: string}
        requestKey: {type: string}
        status: {type: string, enum: [WAITING_APPROVAL, QUEUED, DEPLOYING, SUCCEEDED, FAILED, ROLLED_BACK, CANCELLED]}
        detail: {type: string}
        candidateContainer: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
